name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a change on Trinks' side shows up even without a commit here.
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Tools match the Trinks OpenAPI spec
        run: npm run check:spec
